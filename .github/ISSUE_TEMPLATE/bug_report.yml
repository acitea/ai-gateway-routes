name: Bug Report
description: Report a bug in ai-gateway-routes.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: manifest
    attributes:
      label: Route Manifest
      description: Paste the smallest YAML manifest that reproduces the issue.
      render: yaml
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
