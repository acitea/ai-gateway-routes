name: Feature Request
description: Suggest an improvement to the manifest format, CLI, compiler, or editor tooling.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Include a YAML or CLI example if helpful.
      render: yaml
